name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.12 is production; 3.11 is a compatibility check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev,explain,monitor,analysis]"

      - name: Lint
        run: ruff check src tests

      - name: Train (the pipeline must run end to end)
        run: python -m churnguard.train --skip-figures

      - name: Test
        run: pytest -v --cov=churnguard --cov-report=term-missing --cov-fail-under=77

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: reports/metrics.json
