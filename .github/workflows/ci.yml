name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.12 is production; 3.11 is a compatibility check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev,explain,monitor,analysis]"

      - name: Lint
        run: ruff check src tests

      - name: Train (the pipeline must run end to end)
        run: python -m churnguard.train --skip-figures

      - name: Test
        run: pytest -v --cov=churnguard --cov-report=term-missing --cov-fail-under=79

      - name: Upload model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}
          path: reports/metrics.json

  container:
    # Build the production image, start it, and hit it over HTTP the way a user would.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t churnguard:ci .

      - name: Start container
        run: docker run -d --name churnguard -p 8000:8000 churnguard:ci

      - name: Smoke test (/health/ready and /predict)
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Model version records the commit (not "unknown")
        run: |
          VERSION=$(curl -fsS http://localhost:8000/model-info | python3 -c "import sys,json; print(json.load(sys.stdin)['model_version'])")
          echo "model_version=${VERSION}"
          test "${VERSION#unknown}" = "${VERSION}"
          test "${VERSION%%-*}" = "$(echo '${{ github.sha }}' | cut -c1-7)"

      - name: Runs as a non-root user
        run: test "$(docker exec churnguard id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs churnguard
