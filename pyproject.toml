[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "1.0.0"
description = "Cost-sensitive customer churn prediction, from raw CSV to a served API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Per-customer SHAP drivers in /predict. Heavy (numba + llvmlite), so optional.
explain = ["shap>=0.46"]
# Evidently renders the HTML drift report only (~400 MB installed); /drift works without it.
monitor = ["evidently>=0.7"]
# Kaplan-Meier and Cox time-to-churn analysis (reports only, not needed to serve).
analysis = ["lifelines>=0.30"]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "httpx>=0.26", "ruff>=0.4"]

[project.scripts]
churnguard-train = "churnguard.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: full training run on the real dataset (~1 min)"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["churnguard"]
